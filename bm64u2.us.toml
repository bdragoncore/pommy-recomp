# Tag each model part's matrix with its node so RT64 interpolates every part
# against itself (src/game/interpolation.cpp). $s1 is the node, $s2 the
# display list the matrix load is about to be written to.
[[patches.hook]]
func = "func_8000E728"
before_vram = 0x8000E848
text = "bm64u2_tag_model_part(rdram, ctx);"

# Rumble alongside the Controller Pak: after the game's osMotorInit call,
# before it reads the result (src/game/input.cpp, bm64u2_motor_init_done).
[[patches.hook]]
func = "func_80006358"
before_vram = 0x80006398
text = "bm64u2_motor_init_done(rdram, ctx);"
