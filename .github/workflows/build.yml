# Builds BM64U2Recompiled on every platform the other N64: Recompiled ports ship
# and uploads the packages. The recompiled game code is checked in as
# RecompiledFuncs/, so CI needs no ROM; players still pick their own ROM in the
# launcher. A v* tag also publishes the packages as that tag's release.
#
# AppImages and tar.gz files are uploaded as the files themselves (archive:
# false). Do not wrap them in a zip.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  linux:
    name: Linux ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: X64
          - os: ubuntu-24.04-arm
            label: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build the AppImage and tar.gz
        # The same ubuntu:22.04 build as a local release.sh run, so the
        # packages only need glibc 2.35.
        run: |
          docker run --rm -e VERSION="$VERSION" -e OWNER="$(id -u):$(id -g)" \
            -v "$PWD:/src" docker.io/library/ubuntu:22.04 \
            sh /src/.github/linux/release.sh --in-container

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          path: out/*.AppImage
          archive: false

      - name: Upload the tar.gz
        uses: actions/upload-artifact@v7
        with:
          path: out/*.tar.gz
          archive: false

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows
          - os: macos-14
            name: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja make -y
          curl -sSfL -o LLVM.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.3/LLVM-19.1.3-Windows-X64.tar.xz
          mkdir -p portable-llvm
          7z x LLVM.tar.xz
          7z x LLVM.tar -oportable-llvm
          echo "LLVM_BIN=$(pwd)/portable-llvm/LLVM-19.1.3-Windows-X64/bin" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja sdl2 freetype llvm lld
          echo "LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Build N64Recomp
        run: |
          # Apple clang on macOS (Homebrew LLVM 23 breaks rabbitizer). GNU
          # clang.exe on Windows — clang-cl rejects the MIPS flags later, but
          # N64Recomp itself is host C++.
          CMAKE_CC=()
          if [ "${{ runner.os }}" = Windows ]; then
            CMAKE_CC=(-DCMAKE_C_COMPILER="$LLVM_BIN/clang.exe" -DCMAKE_CXX_COMPILER="$LLVM_BIN/clang++.exe")
          fi
          cmake -S N64ModernRuntime/N64Recomp -B n64recomp-build -G Ninja -DCMAKE_BUILD_TYPE=Release "${CMAKE_CC[@]}"
          cmake --build n64recomp-build --target N64RecompCLI -j

      - name: Build the game patches
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            make -C patches CC="$LLVM_BIN/clang.exe" LD="$LLVM_BIN/ld.lld.exe"
          else
            make -C patches CC="$LLVM_BIN/clang" LD="$(brew --prefix lld)/bin/ld.lld"
          fi

      - name: Recompile the game patches
        run: |
          N64RECOMP=./n64recomp-build/N64Recomp
          [ -f "$N64RECOMP.exe" ] && N64RECOMP=$N64RECOMP.exe
          "$N64RECOMP" patches.toml

      - name: Build
        run: |
          # clang-cl on Windows (RecompFrontend/RT64 pass /W4), Apple clang on
          # macOS.
          CMAKE_CC=()
          if [ "${{ runner.os }}" = Windows ]; then
            # Portable llvm-mt has no libxml2, so mt comes from the Windows SDK.
            # RC stays llvm-rc: with clang-cl, CMake drives it through
            # cmake_llvm_rc, whose flags the SDK's rc.exe rejects.
            WINSDK_BIN=$(ls -1d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64 | tail -1)
            CMAKE_CC=(
              -DCMAKE_C_COMPILER="$LLVM_BIN/clang-cl.exe"
              -DCMAKE_CXX_COMPILER="$LLVM_BIN/clang-cl.exe"
              -DCMAKE_MT="$WINSDK_BIN/mt.exe"
              -DCMAKE_RC_COMPILER="$LLVM_BIN/llvm-rc.exe"
            )
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${CMAKE_CC[@]}"
          cmake --build build -j --target BM64U2Recompiled

      - name: Package
        run: |
          APP=BM64U2Recompiled
          stage="stage/$APP"
          mkdir -p "$stage" out
          cp -r build/assets recompcontrollerdb.txt COPYING README.md "$stage/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp build/$APP.exe "$stage/"
            cp lib/rt64/src/contrib/dxc/bin/x64/dxcompiler.dll lib/rt64/src/contrib/dxc/bin/x64/dxil.dll "$stage/"
            cp lib/rt64/src/contrib/mupen64plus-win32-deps/SDL2-2.26.3/lib/x64/SDL2.dll "$stage/"
            (cd stage && 7z a -tzip "../out/$APP-$VERSION-Windows-X64.zip" "$APP" > /dev/null)
          else
            cp build/$APP "$stage/"
            tar -C stage -czf "out/$APP-$VERSION-macOS-ARM64.tar.gz" "$APP"
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: out/*
          archive: false

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [linux, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
          # Keep the Windows .zip as a file instead of unpacking it.
          skip-decompress: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * > "SHA256SUMS-$VERSION.txt"
          gh release view "$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$VERSION" -R "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes
          gh release upload "$VERSION" -R "$GITHUB_REPOSITORY" --clobber *
